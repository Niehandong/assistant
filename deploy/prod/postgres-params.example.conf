# PostgreSQL 生产参数样例（tech-design-m2 3.10.3 生产列），按 16 核 / 64GB 专用 DB 主机给出，按实际按比例调整。
# 用法：生产 compose 中 command: ["postgres", "-c", "key=value", ...]，或挂载为 postgresql.conf 的 include 文件。
# 容器部署时需把 shm_size 调到 >= maintenance_work_mem（HNSW 并行构建使用共享内存），建议 shm_size: 16gb。
# 由 BE-29 落地到 deploy/docker-compose.prod.yml。
shared_buffers = 16GB
effective_cache_size = 48GB
work_mem = 64MB                  # 注意 × 并发连接数
maintenance_work_mem = 8GB       # HNSW 构建尽量在内存中完成
max_worker_processes = 32
max_parallel_workers = 16
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 8
random_page_cost = 1.1
effective_io_concurrency = 200
jit = off
max_connections = 400            # 各服务连接池之和 + 余量（kb 每实例池 20）
