# 本地中间件：PostgreSQL 16(+pgvector) + Redis 7 + MinIO。
# 宿主机端口为本项目专属（避免与本机其他项目冲突）；桶由 devctl.py init 创建。前后端不进容器。
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kbp-postgres
    # 检索性能参数（tech-design-m2 3.10.3 本地列；与其他项目共用 15GB 机器，取值偏保守）。
    # shm_size：并行查询与 HNSW 并行构建使用 /dev/shm，docker 默认 64MB 不够。生产参数见 deploy/prod/postgres-params.example.conf
    shm_size: 2gb
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=4GB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - max_worker_processes=16
      - -c
      - max_parallel_workers=8
      - -c
      - max_parallel_workers_per_gather=4
      - -c
      - max_parallel_maintenance_workers=4
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - jit=off
      - -c
      - max_connections=200
    environment:
      POSTGRES_USER: kbp
      POSTGRES_PASSWORD: kbp
      POSTGRES_DB: kbp
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - ./.docker-data/postgres:/var/lib/postgresql/data
      - ./deploy/local/postgres-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kbp -d kbp"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: kbp-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-16379}:6379"
    volumes:
      - ./.docker-data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: kbp-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIO_API_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - ./.docker-data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
