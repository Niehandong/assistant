# 本地中间件：PostgreSQL 16(+pgvector) + Redis 7 + MinIO。
# 宿主机端口为本项目专属（避免与本机其他项目冲突）；桶由 devctl.py init 创建。前后端不进容器。
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kbp-postgres
    environment:
      POSTGRES_USER: kbp
      POSTGRES_PASSWORD: kbp
      POSTGRES_DB: kbp
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - ./.docker-data/postgres:/var/lib/postgresql/data
      - ./deploy/local/postgres-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kbp -d kbp"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: kbp-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-16379}:6379"
    volumes:
      - ./.docker-data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: kbp-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIO_API_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - ./.docker-data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
