# 仅承载工具配置（ruff / mypy / pytest），后端不作为包发布。
[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["**/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["platform_common", "app"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
explicit_package_bases = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/libs/platform_common"
exclude = ["/alembic/versions/", "/tests/"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["libs/platform_common/tests", "services"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "aioboto3.*", "aiobotocore.*"]
ignore_missing_imports = true
